name: Поделиться опытом
description: Промпт или кейс — опубликуется на сайте автоматически после проверки
title: "[склад] "
labels: ["submission"]
body:
  - type: dropdown
    id: section
    attributes:
      label: Раздел
      options:
        - Промпт
        - Кейс
    validations:
      required: true
  - type: input
    id: post_title
    attributes:
      label: Название
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Для чего
      description: Одна-две строки — какую задачу решает
    validations:
      required: true
  - type: textarea
    id: post_body
    attributes:
      label: Промпт или описание кейса
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: Как использовать
  - type: textarea
    id: why
    attributes:
      label: Почему работает / выводы
  - type: input
    id: tags
    attributes:
      label: Теги
      description: Через запятую, до 5
  - type: input
    id: models
    attributes:
      label: Модели
      description: Через запятую, например claude, gpt
