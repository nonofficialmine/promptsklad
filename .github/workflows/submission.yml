name: Submission

on:
  issues:
    types: [opened, edited]

concurrency:
  group: submission
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: startsWith(github.event.issue.title, '[склад]') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - id: gen
        run: node scripts/submission.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}

      - name: Ошибки валидации -> комментарий
        if: steps.gen.outputs.ok != 'true'
        run: gh issue comment "$NUMBER" --body "$MESSAGE"
        env:
          MESSAGE: ${{ steps.gen.outputs.message }}

      - name: Проверка сборки
        id: build
        if: steps.gen.outputs.ok == 'true'
        run: npm run build

      - name: Сборка упала -> комментарий
        if: failure() && steps.gen.outputs.ok == 'true'
        run: gh issue comment "$NUMBER" --body "Пост не собрался, модератор посмотрит. Лог: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Коммит, комментарий, закрытие
        if: steps.gen.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Пост #$NUMBER от @$AUTHOR"
          git pull --rebase
          git push
          gh issue comment "$NUMBER" --body "$MESSAGE. Vercel обновит сайт через пару минут."
          gh issue close "$NUMBER"
        env:
          FILE: ${{ steps.gen.outputs.file }}
          MESSAGE: ${{ steps.gen.outputs.message }}
          AUTHOR: ${{ github.event.issue.user.login }}
