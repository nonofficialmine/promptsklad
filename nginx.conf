server {
    listen 80;
    root /usr/share/nginx/html;

    # чистые URL: /prompts/code-review -> code-review.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /health {
        default_type application/json;
        return 200 '{"app":"promptsklad","status":"ok"}';
    }

    error_page 404 /404.html;
}
